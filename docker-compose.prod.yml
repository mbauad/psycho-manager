version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psycho-manager
    restart: always
    ports:
      - "3000:3000"
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - psycho_supabase_default
      - easypanel
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Labels para o Traefik do Easypanel rotear automaticamente
      - "traefik.enable=true"
      - "traefik.http.routers.psycho-manager.rule=Host(`psycho-manager.site`)"
      - "traefik.http.routers.psycho-manager.entrypoints=web,websecure"
      - "traefik.http.routers.psycho-manager.tls.certresolver=letsencrypt"
      - "traefik.http.services.psycho-manager.loadbalancer.server.port=3000"
      - "traefik.http.services.psycho-manager.loadbalancer.healthcheck.path=/login"
      - "traefik.http.services.psycho-manager.loadbalancer.healthcheck.interval=30s"

networks:
  psycho_supabase_default:
    external: true
  easypanel:
    external: true
